name: Deploy to EdgeSpark

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ secrets.EDGESPARK_API_KEY != '' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            web/package-lock.json

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Install EdgeSpark CLI
        run: npm install -g @edgespark/cli

      - name: Validate deployment
        env:
          EDGESPARK_API_KEY: ${{ secrets.EDGESPARK_API_KEY }}
        run: edgespark deploy --dry-run

      - name: Deploy
        env:
          EDGESPARK_API_KEY: ${{ secrets.EDGESPARK_API_KEY }}
        run: edgespark deploy
